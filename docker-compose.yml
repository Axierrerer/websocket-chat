name: websocket-chat

services:
  app:
    container_name: websocket-chat-app
    build: .
    env_file: .env
    environment:
      APP_HOST: 0.0.0.0
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - websocket-chat-network
    restart: unless-stopped

  redis:
    container_name: websocket-chat-redis
    image: redis:8.0-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - websocket-chat-network
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:

networks:
  websocket-chat-network:
